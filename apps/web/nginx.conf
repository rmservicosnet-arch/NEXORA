server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API é servida no MESMO domínio, sob /api.
  #
  # Não é só conveniência: com origem única o cookie de refresh deixa de ser
  # de terceiros, e nenhum navegador precisa decidir se o bloqueia. CORS
  # também deixa de existir como problema.
  #
  # E resolve o acoplamento do Vite: `VITE_API_URL` é embutido no bundle em
  # tempo de build. Apontando para `/api`, a MESMA imagem serve homologação e
  # produção — o que muda é para onde o nginx encaminha.
  location /api/ {
    proxy_pass         http://api:3333/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Upload de imagem vai até 10 MB (docs/MEDIA.md §4). O padrão do nginx é
    # 1 MB, e o erro que ele devolve não diz o que aconteceu.
    client_max_body_size 12m;
  }

  # Aplicação de página única: qualquer rota desconhecida devolve o index e o
  # roteador do navegador resolve. Sem isto, recarregar em /produtos/123 dá
  # 404 — e o usuário conclui que o sistema perdeu a página.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Os arquivos com hash no nome podem ser cacheados para sempre; o index,
  # nunca — é ele que aponta para o hash novo depois de cada publicação.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
